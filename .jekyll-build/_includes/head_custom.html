<script>
    /* 1. Synchronously swap theme stylesheet in <head> to prevent flashing on load */
    (function () {
        let savedTheme;
        try {
            savedTheme = localStorage.getItem('theme');
            if (!savedTheme) {
                /* Fallback to device system setting if no selection has been saved */
                savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
        } catch (err) {
            savedTheme = 'light';
        }

        /* Set the attribute immediately on the html element */
        document.documentElement.setAttribute('data-theme', savedTheme);

        /* Swap stylesheet link href synchronously before rendering begins */
        if (savedTheme) {
            const links = document.querySelectorAll('link[rel="stylesheet"]');
            for (let link of links) {
                /* Target only the main theme stylesheet (default, light, or dark) and skip the head-nav stylesheet */
                if (link.href && link.href.includes('just-the-docs-') && !link.href.includes('head-nav')) {
                    link.href = link.href.replace(/just-the-docs-(default|light|dark)\.css/, `just-the-docs-${savedTheme}.css`);
                    break;
                }
            }
        }
    })();

    /* 2. Register the service worker and reload open pages onto new builds.
     *
     * Page content itself is kept fresh by the worker's network-first strategy, so a
     * plain visit already shows the newest version. This block covers the other case:
     * a page that was already open when a new build landed. */
    if ('serviceWorker' in navigator) {
        /* Read synchronously, before any worker can claim this page. A null controller
         * means this load was never served by a worker, so there is nothing stale on
         * screen and the first-ever registration must not trigger a reload. */
        const WAS_CONTROLLED = !!navigator.serviceWorker.controller;
        const RELOAD_GUARD_KEY = 'pwa-reloaded-for-build';
        const UPDATE_CHECK_INTERVAL_MS = 60000;

        let reloading = false;

        /* Reloads at most once per build id. Without the guard, a worker that keeps
         * re-activating would put the page into a reload loop. */
        const reloadForBuild = (buildId) => {
            if (!WAS_CONTROLLED || reloading) {
                return;
            }
            if (buildId) {
                try {
                    if (sessionStorage.getItem(RELOAD_GUARD_KEY) === buildId) {
                        return;
                    }
                    sessionStorage.setItem(RELOAD_GUARD_KEY, buildId);
                } catch (err) {
                    /* Private browsing can refuse sessionStorage; the `reloading` flag
                     * still prevents a loop within this page's lifetime. */
                }
            }
            reloading = true;
            console.log('[PWA] New build activated, reloading onto it:', buildId || '(unknown)');
            window.location.reload();
        };

        navigator.serviceWorker.addEventListener('message', (event) => {
            const data = event.data || {};
            if (data.type === 'BUILD_ACTIVATED') {
                reloadForBuild(data.buildId);
            }
        });

        /* Messages from the worker stay queued until onmessage is assigned or this is
         * called. Registering the listener above is not enough on its own, and without
         * this the build id never arrives -- reloads would fall back to the blunter
         * controllerchange path below. */
        if (navigator.serviceWorker.startMessages) {
            navigator.serviceWorker.startMessages();
        }

        /* Fallback for the case where the message is missed because the page was not
         * yet listening when the worker activated. */
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            reloadForBuild(null);
        });

        window.addEventListener('load', () => {
            /* Dynamically detect base path to support both custom domains and GitHub Pages subpaths */
            let basePath = '/';
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 1 && pathParts[1] === 'recipes') {
                basePath = '/recipes/';
            }

            const swUrl = basePath + 'sw.js';
            console.log('[PWA] Registering Service Worker at:', swUrl);

            /* updateViaCache:'none' keeps GitHub Pages' ten-minute max-age from
             * delaying detection of a new worker. */
            navigator.serviceWorker.register(swUrl, {updateViaCache: 'none'})
                .then(registration => {
                    console.log('[PWA] Service Worker registered successfully with scope:', registration.scope);

                    const checkForUpdate = () => {
                        if (document.hidden || !navigator.onLine) {
                            return;
                        }
                        registration.update().catch(err => {
                            console.log('[PWA] Update check failed:', err);
                        });
                    };

                    /* Check on the occasions a new build is most likely to be waiting:
                     * returning to an installed PWA, regaining connectivity, and
                     * periodically while the page is actually on screen. */
                    document.addEventListener('visibilitychange', checkForUpdate);
                    window.addEventListener('online', checkForUpdate);
                    window.addEventListener('focus', checkForUpdate);
                    setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
                })
                .catch(error => {
                    console.error('[PWA] Service Worker registration failed:', error);
                });
        });
    }
</script>
