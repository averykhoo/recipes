name: Deploy Recipes to GitHub Pages

on:
  push:
    branches: ["master"] # Or "main"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Gate: nothing is published unless the parser test suite passes.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser test suite
        run: python -m pytest -q

      # Content lint. Reported for visibility but does not block publishing, since a
      # recipe the parser cannot fully read is still a recipe worth putting on the site.
      - name: Validate recipe corpus
        continue-on-error: true
        run: python validate_recipes_v2.py --no-json

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # --- Custom Pre-build Steps for this Repository ---
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Assemble site - clone folders for Jekyll
        run: |
          cp -r curated-untested .jekyll-build/_curated-untested
          cp -r in-progress .jekyll-build/_in-progress
          cp -r recipes .jekyll-build/_recipes

      # This single script handles cleanup, front matter, and link fixing.
      - name: Run Jekyll Pre-build Script
        run: |
          pip install -r requirements.txt
          cd .jekyll-build && python scripts/jekyll_prebuild.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      # STEP 2: Build the site with Jekyll, pointing to the prepared directory.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1 # note that this uses jekyll v3.10.0 and cannot be changed
        with:
          # Tell Jekyll to use our generated directory as its source
          source: ./.jekyll-build
          # Tell Jekyll to place the final site *inside* that same directory
          destination: ./.jekyll-build/_site
          # This option suggested by gemini does not exist
          # `Warning: Unexpected input(s) 'use_gemfile', valid inputs are ['entryPoint', 'args', 'source', ...]`
          #use_gemfile: true

      # Generate the service worker from scripts/sw_template.js. Replaces workbox-cli:
      # pages are served network-first so a deploy is visible on the next page view,
      # and the offline copy is refreshed in the background after the worker activates.
      - name: Generate Service Worker
        run: |
          sudo chown -R $USER:$USER ./.jekyll-build/_site
          python scripts/build_sw.py

      # Smoke-test the built site. These assertions need the real Jekyll output, so
      # unlike the pytest suite in the `test` job they cannot run before the build.
      - name: Verify built site
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path

          site = Path('.jekyll-build/_site')
          failures = []

          service_worker = site / 'sw.js'
          if not service_worker.is_file():
              failures.append('sw.js was not generated')
          else:
              rendered = service_worker.read_text(encoding='utf-8')
              for placeholder in ('__BUILD_ID__', '__SHELL_ASSETS__', '__PAGES__'):
                  if placeholder in rendered:
                      failures.append(f'sw.js still contains the {placeholder} placeholder')

          published_source = sorted(p.relative_to(site).as_posix() for p in site.rglob('*.py'))
          if published_source:
              failures.append(f'python source published to the site: {published_source}')

          if not (site / 'static' / '3d-moon-widget.html').is_file():
              failures.append('static/3d-moon-widget.html is missing from the built site')

          recipe_pages = list((site / 'recipes').rglob('*.html'))
          if len(recipe_pages) < 10:
              failures.append(f'only {len(recipe_pages)} recipe pages were built')

          for failure in failures:
              print(f'FAIL: {failure}')
          if failures:
              sys.exit(1)
          print(f'Built site verified: {len(recipe_pages)} recipe pages, service worker stamped.')
          EOF

      # STEP 3: Upload the final, built site from the correct location.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Point the uploader to the destination we specified above
          path: ./.jekyll-build/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5